    <script language="javascript" type="text/javascript">
        // Variable global para almacenar el userId del usuario autenticado
        var currentUserId = null;

        // Función para obtener parámetro de la URL
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Función para obtener el NUSA_Guids configurable
        function getNusaGuids() {
            // Parte fija del GUID (segunda parte después del /)
            var fixedPart = "b195c4d5-94f3-4045-9b7e-41072f13aa4e";

            // 1. Prioridad: parámetro URL (solo primera parte)
            var urlGuids = getUrlParameter('nusa_guids');
            if (urlGuids && urlGuids.trim() !== '') {
                var fullGuids = urlGuids.trim() + "/" + fixedPart;
                console.log('Usando NUSA_Guids desde URL:', fullGuids);
                return fullGuids;
            }

            // 2. Segundo: localStorage
            var savedGuids = localStorage.getItem('nusa_guids');
            if (savedGuids && savedGuids.trim() !== '') {
                console.log('Usando NUSA_Guids desde localStorage:', savedGuids);
                return savedGuids;
            }

            // 3. Por defecto
            var defaultGuids = "f0d9d89c-def2-4d98-a31e-1ec23b6b8d01/" + fixedPart;
            console.log('Usando NUSA_Guids por defecto:', defaultGuids);
            return defaultGuids;
        }

        function NUSA_configure() {
            console.log("Configuring Nuance with user:", currentUserId);

            // Obtener el NUSA_Guids configurable (URL > localStorage > default)
            var nusaGuids = getNusaGuids();

            // Configurar Nuance con el GUIDs configurable
            document.cookie = "NUSA_Guids=" + nusaGuids;


            NUSA_userId = currentUserId;
            NUSA_applicationName = "DMSK";
            NUSA_language = "es-ES";
            NUSA_topic = "Radiology";

            console.log("NUSA_userId:", NUSA_userId);

            // Configurar el speech bar
            NUSA_embedSpeechBar(document.getElementById("speechBarContainer"));
        }

        function loadNuanceSpeechAnywhere() {
            // Cargar el script de Nuance después del login
            console.log('Loading Nuance SpeechAnywhere script');

            // Crear elemento script dinámicamente
            const script = document.createElement('script');
            script.language = 'javascript';
            script.type = 'text/javascript';
            // Cargar el script de Nuance
            script.src = 'https://speechanywhere.nuancehdp.com/mainline/scripts/Nuance.SpeechAnywhere.js';

            script.onerror = function() {
                console.error("Failed to load Nuance script");
            };

            // Cuando el script termine de cargar, inicializar la configuración
            script.onload = function() {
                console.log("Nuance script loaded, configuring...");
                setTimeout(function() {
                    NUSA_configure();
                }, 100);
            };

            // Agregar el script al head del documento
            document.head.appendChild(script);
        }

    <script type="text/javascript">


        $(document).ready(function () {

            // Variables para controlar timeouts de notificaciones y botones
            let themeNotificationTimeout;
            let copyNotificationTimeout;
            let copyButtonTimeout;
            let loginErrorNotificationTimeout;

            // Función para mostrar notificación de tema
            function showThemeNotification(theme) {
                const notification = document.getElementById('theme-notification');
                const icon = notification.querySelector('i');
                const text = notification.querySelector('span');

                // Limpiar timeouts anteriores
                if (themeNotificationTimeout) {
                    clearTimeout(themeNotificationTimeout);
                }

                // Resetear animación y estado
                notification.style.animation = '';
                notification.style.display = 'none';

                if (theme === 'dark') {
                    icon.className = 'mdi mdi-moon-waning-crescent';
                    text.textContent = 'Modo oscuro activado';
                    notification.style.backgroundColor = '#2e7d32';
                } else {
                    icon.className = 'mdi mdi-white-balance-sunny';
                    text.textContent = 'Modo claro activado';
                    notification.style.backgroundColor = '#28a745';
                }

                // Forzar reflow para resetear animación
                notification.offsetHeight;

                notification.style.display = 'block';

                // Ocultar automáticamente después de 3 segundos
                themeNotificationTimeout = setTimeout(function() {
                    notification.style.animation = 'slideOut 0.3s ease-in forwards';
                    setTimeout(function() {
                        notification.style.display = 'none';
                        notification.style.animation = '';
                    }, 300);
                }, 3000);
            }

            // Función para mostrar notificación de error de login
            function showLoginErrorNotification() {
                const notification = document.getElementById('login-error-notification');

                // Limpiar timeouts anteriores
                if (loginErrorNotificationTimeout) {
                    clearTimeout(loginErrorNotificationTimeout);
                }

                // Resetear animación y estado
                notification.style.animation = '';
                notification.style.display = 'none';

                // Forzar reflow para resetear animación
                notification.offsetHeight;

                notification.style.display = 'block';

                // Ocultar automáticamente después de 3 segundos
                loginErrorNotificationTimeout = setTimeout(function() {
                    notification.style.animation = 'slideOut 0.3s ease-in forwards';
                    setTimeout(function() {
                        notification.style.display = 'none';
                        notification.style.animation = '';
                    }, 300);
                }, 3000);
            }


            // Función para cambiar el tema
            function toggleTheme() {
                var body = $('body');
                var themeIcon = $('#theme-icon');
                var themeText = $('.theme-text');

                if (body.hasClass('dark-mode')) {
                    // Cambiar a modo claro
                    body.removeClass('dark-mode');
                    themeIcon.removeClass('mdi-moon-waning-crescent').addClass('mdi-weather-sunny');
                    themeText.text('Tema');
                    localStorage.setItem('theme', 'light');
                    showThemeNotification('light');
                } else {
                    // Cambiar a modo oscuro
                    body.addClass('dark-mode');
                    themeIcon.removeClass('mdi-weather-sunny').addClass('mdi-moon-waning-crescent');
                    themeText.text('Tema');
                    localStorage.setItem('theme', 'dark');
                    showThemeNotification('dark');
                }
            }

            // Evento click del botón
            $('#theme-toggle').on('click', function() {
                toggleTheme();
            });


            // Función para cerrar sesión
            function logout() {
                // La solución más simple: recargar la página completa
                // Esto limpia automáticamente todos los scripts, variables globales y estado
                console.log('Cerrando sesión - recargando página');
                window.location.reload();
            }

            // Evento click del botón de cerrar sesión
            $('#logout-btn').on('click', function() {
                logout();
            });

            // Cargar tema guardado al iniciar
            var savedTheme = localStorage.getItem('theme');
            var themeIcon = $('#theme-icon');
            var themeText = $('.theme-text');
            if (savedTheme === 'dark') {
                $('body').addClass('dark-mode');
                themeIcon.removeClass('mdi-weather-sunny').addClass('mdi-moon-waning-crescent');
                themeText.text('Tema');
            } else {
                themeIcon.removeClass('mdi-moon-waning-crescent').addClass('mdi-weather-sunny');
                themeText.text('Tema');
            }

            // Función para copiar al portapapeles usando la API moderna
            function copyToClipboard() {
                const textarea = document.getElementById('TxtInforme');
                const text = textarea.value;

                if (navigator.clipboard && window.isSecureContext) {
                    // Usar la API moderna del portapapeles
                    navigator.clipboard.writeText(text).then(function() {
                        console.log('Copiado al portapapeles: ', text);
                        // Mostrar feedback visual (opcional)
                        showCopyFeedback();
                    }).catch(function(err) {
                        console.error('Error al copiar: ', err);
                        // Fallback a método antiguo
                        fallbackCopyTextToClipboard(text);
                    });
                } else {
                    // Fallback para navegadores antiguos o contextos no seguros
                    fallbackCopyTextToClipboard(text);
                }
            }

            // Método fallback para navegadores antiguos
            function fallbackCopyTextToClipboard(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;

                // Evitar que sea visible
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();

                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        console.log('Copiado al portapapeles (fallback): ', text);
                        showCopyFeedback();
                    } else {
                        console.error('Error al copiar (fallback)');
                    }
                } catch (err) {
                    console.error('Error al copiar (fallback): ', err);
                }

                document.body.removeChild(textArea);
            }

            // Función para mostrar notificación
            function showNotification() {
                const notification = document.getElementById('copy-notification');

                // Limpiar timeouts anteriores
                if (copyNotificationTimeout) {
                    clearTimeout(copyNotificationTimeout);
                }

                // Resetear animación y estado
                notification.style.animation = '';
                notification.style.display = 'none';

                // Forzar reflow para resetear animación
                notification.offsetHeight;

                notification.style.display = 'block';

                // Ocultar automáticamente después de 3 segundos
                copyNotificationTimeout = setTimeout(function() {
                    notification.style.animation = 'slideOut 0.3s ease-in forwards';
                    setTimeout(function() {
                        notification.style.display = 'none';
                        notification.style.animation = '';
                    }, 300);
                }, 3000);
            }

            // Función para mostrar feedback visual
            function showCopyFeedback() {
                // Mostrar notificación de la página
                showNotification();

                const button = document.querySelector('.copy-btn');

                // Limpiar timeout anterior del botón
                if (copyButtonTimeout) {
                    clearTimeout(copyButtonTimeout);
                }

                // Resetear estilos del botón
                button.style.background = '';
                button.style.transform = '';

                // Cambiar al icono de check y color verde
                button.innerHTML = '<i class="mdi mdi-check" style="font-size: 20px; margin-right: 8px;"></i>Copiado!';
                button.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';

                // Volver al estado original después de 2 segundos
                copyButtonTimeout = setTimeout(function() {
                    button.innerHTML = '<i class="mdi mdi-content-copy" style="font-size: 20px; margin-right: 8px;"></i>Copiar al portapapeles';
                    button.style.background = '';
                }, 2000);
            }

            // Evento click del botón de copiar
            $('.copy-btn').on('click', function(e) {
                e.preventDefault();
                copyToClipboard();
            });

            // Función para manejar el login
            function handleLogin(event) {
                event.preventDefault();

                // Obtener valores del formulario
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                // Validación: usuario debe ser igual a contraseña
                if (username.trim() !== '' && password.trim() !== '' && username === password) {
                    // Almacenar el userId en variable global
                    currentUserId = username;

                    // Actualizar el texto del botón de logout con el nombre del usuario
                    document.querySelector('.logout-text').textContent = 'Cerrar sesión de ' + currentUserId;
                    document.getElementById('logout-btn').title = 'Cerrar sesión de ' + currentUserId;

                    // Ocultar formulario de login
                    document.getElementById('login-overlay').classList.add('hidden');

                    // Mostrar contenido principal
                    document.getElementById('container').classList.remove('hidden');
                    document.getElementById('load_screen').classList.remove('hidden');

                    // Limpiar formulario
                    document.getElementById('login-form').reset();

                    // Cargar dinámicamente Nuance Speech Anywhere después del login
                    loadNuanceSpeechAnywhere();
                } else {
                    showLoginErrorNotification();
                }
            }

            // Evento submit del formulario de login
            document.getElementById('login-form').addEventListener('submit', handleLogin);

        });
    </script>
</body>

</html>
